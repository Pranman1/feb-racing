# Cone racer parameters. Every value has a comment in racer.py's DEFAULTS.
racer:
  ros__parameters:
    # camera: HSV bounds (h_lo, s_lo, v_lo, h_hi, s_hi, v_hi) and the image band where cones live,
    # calibrated on this car against ground truth; the scene is dark, so value floors are low
    hsv_blue: [105, 220, 8, 135, 255, 255]
    hsv_yellow: [18, 150, 8, 40, 255, 255]
    hsv_orange: [0, 150, 15, 15, 255, 255]
    band_top: 0.20            # fraction of image height; rows above are sky
    band_bottom: 0.36         # rows below are the car's own body
    band_floor: 0.21          # a blob that ends above this is sky
    orange_min_px: 35         # smaller orange-hued blobs are shaded yellow cones
    min_blob_px: 3
    blob_min_value: 25        # mean HSV value of a blob's pixels; darker specks on the ground are not cones
    match_px_frac: 0.04       # a lidar cone takes a blob's colour only within this fraction of the width
    # lap 1: the mapping lap, driven by the simple follower
    map_speed: 1.2
    map_min_speed: 0.8
    speed_tau: 0.8            # s; the mapping lap slows at once but speeds up over this, so the car does not lurch when the known path ahead jumps
    lookahead: 1.0
    follow_range: 3.5         # m; the reactive follower chains only the cones this near (their colours are reliable, far ones are not)
    local_path_lookahead: 1.4   # m, pure-pursuit target along the live cone ordering's local path on lap one
    local_path_min_reach: 2.0 # m of trusted path ahead before lap one follows it; shorter, the reactive follower drives
    rung_max_age: 1.0         # s; older rungs hand lap one back to the reactive follower
    # slam
    keyframe_dist: 0.4        # m between graph poses
    slam_range: 6.0           # m; cones farther than this are not used for the map
    loc_corridor: 2.5         # m; while racing, only landmarks this close to the car's stretch of raceline are matched (adjacent track sections)
    new_landmark_dist: 0.6    # m; a cone farther than this from every known cone of its colour is new
    min_lap_length: 15.0      # m travelled before the car may declare the lap closed
    closure_landmarks: 10     # seeing three of the first ten cones again (after 35 m) closes the loop whatever the drift
    order_timeout: 10.0       # s to wait for the team's cone ordering (feb_cone_ordering) before the boundary walk takes over
    lap_close_dist: 2.0       # m from the start pose that closes the lap
    # raceline
    sample_step: 0.25
    margin: 0.7               # m kept from the cones beyond the car's half width: tracking error is about 0.45 m at speed (a cone hit stalls the car)
    v_max: 4.0                # m/s cap of the speed profile
    a_lat: 3.5                # m/s^2 lateral limit used for cornering speed
    a_acc: 2.5
    a_brake: 3.0
    race_speed_scale: 1.2     # scales the straight-line cap v_max. 1.2 is the fleet limit: clean on the hardest
                              # tracks (hairpins, Silverstone) with 0 steering reversals and 0.24 m of line error;
                              # 1.4 is fine on open layouts but runs 2 m wide on those two (mpc_bench)
    corner_scale: 1.2         # scales the cornering speed (a_lat by its square)
    # mpc model (sysid-calibrated values go here)
    long_a: 27.7              # refit from step responses in the simulator (see docs): the old 74.4/3.2 pair
    long_b: 1.08              # had the car accelerating at 8 m/s^2 where it really makes 3.4, and settling in
    idle_brake: 0.69          # 0.3 s where it really takes 0.9 s, so the MPC hunted for the throttle
    tyre_B: 8.0
    tyre_C: 1.4
    tyre_D: 18.0
    inertia_z: 0.10
    lf: 0.175                 # half of the 0.35 m effective wheelbase from the yaw-rate fit
    lr: 0.175
    # mpc weights
    mpc_horizon: 12
    mpc_dt: 0.1
    w_pos: 8.0
    w_head: 2.0
    w_speed: 0.6
    w_dsteer: 6.0             # on the steering rate (rad/s)^2. At 0.01 the solver bought tracking with
                              # lock-to-lock flicks the servo cannot perform: 110 reversals and 60% of the
                              # lap at full lock on the bench. At 6 it is 0 reversals and a 0.4 rad/s peak,
                              # with better tracking and a faster lap (mpc_bench, fs_comp_2021)
    mpc_steer_tau: 0.15       # s, the steering servo's lag in the model
    w_dtau: 3.0
    dtau_max: 0.4             # throttle units per second, hard bound in the MPC
    dsteer_max: 3.2           # rad/s, the servo's own rate: a hard bound in the MPC, so the plan is executable
    w_tau: 0.3
    tau_max: 0.28             # throttle cap; about 6.5 m/s steady state (0.14 was a limp to hide the oscillation)
    v_cap: 6.0                # m/s ceiling for the MPC's own state; it is lowered to the speed profile's
                              # own cap (v_max x race_speed_scale) at startup, never raised
    push_throttle: 0.16       # not moving with the throttle on: push this hard for 1.5 s before giving up (a cone under the bumper)
    throttle_start: 0.07      # the least throttle that gets the car rolling from rest
    debug: false              # log every lap-one steering decision (which follower, target, reach)
